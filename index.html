<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心语 · 心理健康筛查</title>
<style>
  :root {
    --brand: #6366f1;
    --brand-2: #8b5cf6;
    --brand-soft: #eef2ff;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --low: #10b981;
    --mild: #f59e0b;
    --moderate: #f97316;
    --severe: #ef4444;
    --crisis: #991b1b;
    --radius: 20px;
    --shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
    --shadow-hover: 0 8px 32px rgba(99, 102, 241, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 24px 16px 80px;
  background: linear-gradient(
    160deg,
    #eef2ff 0%,
    #faf5ff 25%,
    #f8fafc 50%,
    #eef2ff 75%,
    #f5f3ff 100%
  );
  background-attachment: fixed;
  background-size: cover;
}

  /* 顶部渐变背景装饰 */

  .wrap { max-width: 780px; margin: 0 auto; }

  /* ===== 头部 ===== */
  .hero {
    text-align: center;
    padding: 32px 0 40px;
  }
  .hero-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px; height: 64px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    font-size: 30px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
  }
  .hero h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ===== 进度条 ===== */
  .progress-wrap {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(248, 250, 252, 0.9);
    backdrop-filter: blur(12px);
    padding: 14px 0;
    margin-bottom: 20px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .bar {
    height: 8px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--brand), var(--brand-2));
    border-radius: 99px;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ===== 卡片 ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .card:hover { box-shadow: var(--shadow-hover); }

  /* ===== 题目 ===== */
  .q-card { padding: 22px 24px; }
  .q-text {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .q-num {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 8px;
    background: var(--brand-soft);
    color: var(--brand);
    font-size: 13px;
    font-weight: 700;
    margin-top: 1px;
  }
  .opts { display: grid; gap: 8px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text);
    transition: all 0.18s ease;
    user-select: none;
  }
  .opt:hover {
    border-color: #c7d2fe;
    background: #fafbff;
    transform: translateX(2px);
  }
  .opt input { display: none; }
  .opt .dot {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #cbd5e1;
    position: relative;
    transition: all 0.18s;
  }
  .opt.checked {
    border-color: var(--brand);
    background: var(--brand-soft);
  }
  .opt.checked .dot {
    border-color: var(--brand);
    background: var(--brand);
  }
  .opt.checked .dot::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 7px; height: 7px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* ===== 按钮 ===== */
  .btn {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    font-family: inherit;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
  }
  .btn:disabled {
    background: #cbd5e1;
    box-shadow: none;
    cursor: not-allowed;
  }
  .btn.secondary {
    background: #fff;
    color: var(--brand);
    border: 1.5px solid var(--line);
    box-shadow: none;
    margin-top: 12px;
  }
  .btn.secondary:hover {
    border-color: var(--brand);
    background: var(--brand-soft);
    transform: none;
    box-shadow: none;
  }

  /* ===== 结果页 ===== */
  .result-hero {
    text-align: center;
    padding: 36px 24px 28px;
  }
  .score-ring {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 20px;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .bg-circle { fill: none; stroke: var(--line); stroke-width: 12; }
  .score-ring .fg-circle {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .score-ring .center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .score-ring .num {
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .score-ring .unit {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }
  .level-tag {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 99px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 4px;
  }
  .level-tag.low { background: #d1fae5; color: #065f46; }
  .level-tag.mild { background: #fef3c7; color: #92400e; }
  .level-tag.moderate { background: #ffedd5; color: #9a3412; }
  .level-tag.severe { background: #fee2e2; color: #991b1b; }
  .level-tag.crisis { background: var(--crisis); color: #fff; }

  /* 危机提示 */
  .crisis-box {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    border: 1.5px solid #fca5a5;
    color: #991b1b;
    border-radius: 14px;
    padding: 16px 20px;
    margin: 20px 0;
    font-weight: 600;
    font-size: 15px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .crisis-box .icon { font-size: 20px; flex-shrink: 0; }

  /* 维度条 */
  .dim { margin: 16px 0; }
  .dim-head {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .dim-head .name { color: var(--text); }
  .dim-head .val { color: var(--muted); font-variant-numeric: tabular-nums; }
  .dim-bar {
    height: 10px;
    background: #f1f5f9;
    border-radius: 99px;
    overflow: hidden;
  }
  .dim-bar > i {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #a5b4fc, #818cf8);
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dim-bar > i.warn { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .dim-bar > i.danger { background: linear-gradient(90deg, #f87171, #dc2626); }

  /* 可解释性 */
  .explain-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 14px;
  }
  .explain-row:last-child { border-bottom: 0; }
  .explain-row .label { color: var(--muted); }
  .explain-row .value { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 8px;
    background: #fef3c7;
    color: #92400e;
    font-size: 13px;
    font-weight: 500;
    margin: 4px 6px 0 0;
  }
  .hint {
    font-size: 13px;
    color: #92400e;
    background: #fffbeb;
    border-left: 3px solid #f59e0b;
    padding: 10px 14px;
    border-radius: 8px;
    margin-top: 8px;
  }

  /* 建议列表 */
  .advice-list { list-style: none; }
  .advice-list li {
    padding: 12px 0 12px 32px;
    position: relative;
    font-size: 15px;
    border-bottom: 1px solid var(--line);
  }
  .advice-list li:last-child { border-bottom: 0; }
  .advice-list li::before {
    content: "";
    position: absolute;
    left: 8px; top: 20px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }

  /* 免责声明 */
  .disclaimer {
    font-size: 13px;
    color: var(--muted);
    background: #f8fafc;
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 20px;
    line-height: 1.6;
    border-left: 3px solid var(--line);
  }

  /* ===== 聊天区 ===== */
  .chat-section {
    margin-top: 24px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .chat-head {
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #fafbff, #fff);
  }
  .chat-head-left { display: flex; align-items: center; gap: 12px; }
  .chat-avatar {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
  }
  .chat-head h3 { font-size: 16px; font-weight: 700; }
  .chat-head .sub { font-size: 12px; color: var(--muted); }
  .chat-status {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 99px;
    background: #f1f5f9;
    color: var(--muted);
  }
  .chat-status.online { background: #d1fae5; color: #065f46; }
  .chat-status.offline { background: #fee2e2; color: #991b1b; }

  .chat-box {
    padding: 20px 24px;
    height: 400px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .chat-box::-webkit-scrollbar { width: 6px; }
  .chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
  .chat-box::-webkit-scrollbar-track { background: transparent; }

  .msg { display: flex; gap: 10px; align-items: flex-end; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .msg.assistant .msg-avatar {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
  }
  .msg.user .msg-avatar {
    background: #e2e8f0;
    color: var(--muted);
  }
  .bubble {
    max-width: 76%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.assistant .bubble {
    background: #f8fafc;
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble.safe {
    background: #fffbeb;
    border: 1.5px solid #fbbf24;
    color: #78350f;
  }
  .msg.assistant .bubble.crisis {
    background: #fef2f2;
    border: 1.5px solid #f87171;
    color: #991b1b;
  }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #94a3b8;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* 安全横幅 */
  .safe-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    border-bottom: 1.5px solid #fca5a5;
    color: #991b1b;
    font-size: 14px;
    font-weight: 600;
    animation: slideDown 0.4s ease;
  }
  @keyframes slideDown {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .safe-banner .icon { font-size: 18px; }

  /* 快捷回复 */
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 24px 12px;
  }
  .quick-replies button {
    width: auto;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    background: var(--brand-soft);
    color: var(--brand);
    border: 1.5px solid transparent;
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.18s;
    font-family: inherit;
  }
  .quick-replies button:hover {
    background: #dbe3ff;
    border-color: var(--brand);
    transform: translateY(-1px);
  }

  /* 输入区 */
  .chat-input-row {
    display: flex;
    padding: 16px 24px 20px;
    gap: 10px;
    border-top: 1px solid var(--line);
  }
  .chat-input-row input {
    flex: 1;
    padding: 13px 18px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.18s;
    font-family: inherit;
    background: #f8fafc;
  }
  .chat-input-row input:focus {
    border-color: var(--brand);
    background: #fff;
  }
  .chat-input-row button {
    width: auto;
    padding: 0 28px;
    border-radius: 12px;
    font-size: 15px;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
  }

  .chat-warn {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 0 24px 16px;
    line-height: 1.5;
  }

  /* ===== 分节标题 ===== */
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 28px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 16px;
    border-radius: 2px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }

  /* 移动端 */
  @media (max-width: 640px) {
    body { padding: 16px 12px 60px; }
    .hero { padding: 20px 0 28px; }
    .hero h1 { font-size: 24px; }
    .card { padding: 20px; border-radius: 16px; }
    .chat-box { padding: 16px; height: 340px; }
    .chat-head, .quick-replies, .chat-input-row, .chat-warn { padding-left: 16px; padding-right: 16px; }
    .bubble { max-width: 82%; }
    .score-ring { width: 140px; height: 140px; }
    .score-ring .num { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="hero">
    <div class="hero-logo">💙</div>
    <h1>心语 · 心理健康筛查</h1>
    <p>20 道题，2 分钟，帮你看清最近的情绪状态。所有答案仅用于本次筛查，不会被存储。</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="progressText">已完成 0 / 20</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="bar"><i id="progress"></i></div>
  </div>

  <form id="form"></form>
  <button class="btn" id="submit" disabled>提交并查看结果</button>
  <p id="err" style="color:#b32020;text-align:center;margin-top:12px"></p>

  <div class="disclaimer">
    本问卷为初步筛查工具，结果不构成医疗诊断。如有强烈痛苦或伤害自己的念头，请立即联系专业机构或拨打 <strong>12356</strong>（全国心理援助热线，24 小时）。
  </div>
</div>

<script>
const API_BASE = localStorage.getItem("apiBase") || "http://127.0.0.1:8000";

const QUESTIONS = [
  "过去两周，你是否经常感到情绪低落、沮丧或绝望？",
  "你是否对平时感兴趣的事情失去了兴趣或乐趣？",
  "你是否觉得生活没有意义，或对未来感到无望？",
  "你是否经常感到紧张、焦虑或坐立不安？",
  "你是否经常担心一些你无法控制的事情？",
  "你是否发现自己难以放松，总觉得有不好的事会发生？",
  "你是否经常入睡困难、睡不安稳或睡眠过多？",
  "你是否经常感到疲倦、没有精力？",
  "你早晨醒来后是否感到没有休息好，仍然很累？",
  "你的食欲是否明显下降或增加？",
  "你是否经常感到头痛、胃痛、肌肉酸痛等身体不适，但查不出原因？",
  "你是否回避与朋友、同学的社交接触？",
  "你是否觉得和别人在一起时感到孤独，即使身边有人？",
  "你是否难以集中注意力，比如学习或看视频时？",
  "你是否发现自己做决定变得很困难，或犹豫不决？",
  "你是否觉得自己没有价值，或让自己或家人失望？",
  "你是否经常自责，觉得自己什么都做不好？",
  "你是否觉得压力大到无法承受？",
  "你是否用过一些不太健康的方式来缓解情绪（如暴饮暴食、熬夜、沉迷手机等）？",
  "你是否出现过“不如消失”或伤害自己的念头？"
];
const OPTIONS = ["完全没有", "有几天", "一半以上的天数", "几乎每天"];

let screenResult = null;
let chatHistory = [];

const form = document.getElementById("form");
const submitBtn = document.getElementById("submit");
const progress = document.getElementById("progress");
const progressText = document.getElementById("progressText");
const progressPct = document.getElementById("progressPct");
const errBox = document.getElementById("err");
const answers = new Array(QUESTIONS.length).fill(null);

QUESTIONS.forEach((text, qi) => {
  const card = document.createElement("div");
  card.className = "card q-card";
  card.innerHTML = `<div class="q-text"><span class="q-num">${qi + 1}</span><span>${text}</span></div>`;
  const opts = document.createElement("div");
  opts.className = "opts";

  OPTIONS.forEach((label, vi) => {
    const lab = document.createElement("label");
    lab.className = "opt";
    lab.innerHTML = `<input type="radio" name="q${qi}" value="${vi}"><span class="dot"></span><span>${label}</span>`;
    lab.querySelector("input").addEventListener("change", () => {
      answers[qi] = vi;
      opts.querySelectorAll(".opt").forEach(l => l.classList.remove("checked"));
      lab.classList.add("checked");
      updateProgress();
    });
    opts.appendChild(lab);
  });

  card.appendChild(opts);
  form.appendChild(card);
});

function updateProgress() {
  const done = answers.filter(a => a !== null).length;
  const pct = Math.round(done / QUESTIONS.length * 100);
  progress.style.width = pct + "%";
  progressText.textContent = `已完成 ${done} / ${QUESTIONS.length}`;
  progressPct.textContent = pct + "%";
  submitBtn.disabled = done !== QUESTIONS.length;
}

submitBtn.addEventListener("click", async () => {
  errBox.textContent = "";
  submitBtn.disabled = true;
  submitBtn.textContent = "分析中…";
  try {
    const res = await fetch(`${API_BASE}/api/screen`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answers })
    });
    if (!res.ok) throw new Error(`请求失败（${res.status}）`);
    screenResult = await res.json();
    renderResult(screenResult);
  } catch (e) {
    errBox.textContent = "出错了：" + e.message + "。请确认后端已启动。";
    submitBtn.disabled = false;
    submitBtn.textContent = "提交并查看结果";
  }
});

function renderResult(r) {
  const colorMap = {
    low: "#10b981", mild: "#f59e0b", moderate: "#f97316",
    severe: "#ef4444", crisis: "#991b1b"
  };
  const ringColor = colorMap[r.color] || "#6366f1";
  const circumference = 2 * Math.PI * 70;
  const offset = circumference * (1 - r.score / 100);

  // 维度条
  let dimHtml = "";
  for (const [name, d] of Object.entries(r.dimensions)) {
    if (name === "危机信号") continue;
    const pct = Math.round(d.score / d.max * 100);
    const cls = pct >= 70 ? "danger" : pct >= 40 ? "warn" : "";
    dimHtml += `
      <div class="dim">
        <div class="dim-head"><span class="name">${name}</span><span class="val">${d.score} / ${d.max} · ${pct}%</span></div>
        <div class="dim-bar"><i class="${cls}" style="width:${pct}%"></i></div>
      </div>`;
  }

  // 可解释性
  const ex = r.explanation;
  const interactions = ex.interactions_triggered || [];
  const interactionHtml = interactions.length > 0
    ? interactions.map(i => `<span class="chip">${i.pair} ×${i.factor}</span>`).join("")
    : `<span style="color:#94a3b8;font-size:13px">未触发维度交互放大</span>`;
  const thresholdNotes = ex.threshold_notes && ex.threshold_notes.length > 0
    ? ex.threshold_notes.map(n => `<div class="hint">${n}</div>`).join("")
    : `<div style="font-size:13px;color:#94a3b8">作答模式正常，阈值未调整</div>`;

  // 建议
  const adviceHtml = r.advice.map(a => `<li>${a}</li>`).join("");

  // 危机
  const crisisHtml = (r.crisis && r.crisis_detail)
    ? `<div class="crisis-box"><span class="icon">⚠️</span><span>${r.crisis_detail.message}</span></div>`
    : "";

  document.getElementById("app").innerHTML = `
    <div class="card result-hero">
      <div class="score-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="bg-circle" cx="80" cy="80" r="70"></circle>
          <circle class="fg-circle" cx="80" cy="80" r="70"
                  stroke="${ringColor}"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${circumference}"></circle>
        </svg>
        <div class="center">
          <div class="num" style="color:${ringColor}">${r.score}</div>
          <div class="unit">/ 100 分</div>
        </div>
      </div>
      <div class="level-tag ${r.color}">${r.level}</div>
      ${crisisHtml}
    </div>

    <div class="card">
      <div class="section-title">各维度得分</div>
      ${dimHtml}
    </div>

    <div class="card">
      <div class="section-title">评估依据（可解释性）</div>
      <div class="explain-row"><span class="label">加权原始分</span><span class="value">${ex.raw_score} / ${ex.raw_max}</span></div>
      <div class="explain-row"><span class="label">交互放大系数</span><span class="value">×${ex.interaction_multiplier}</span></div>
      <div class="explain-row"><span class="label">归一化得分</span><span class="value">${ex.normalized_score} / 100</span></div>
      <div class="explain-row"><span class="label">动态阈值</span><span class="value">${ex.thresholds_used.join(" / ")}</span></div>
      <div class="explain-row"><span class="label">极端作答比例</span><span class="value">${(ex.answer_pattern.extreme_ratio * 100).toFixed(0)}%</span></div>
      <div class="explain-row"><span class="label">维度一致性偏差</span><span class="value">${(ex.answer_pattern.inconsistency * 100).toFixed(0)}%</span></div>
      <div style="margin-top:16px">
        <div style="font-size:13px;color:#64748b;margin-bottom:6px">触发的维度交互</div>
        ${interactionHtml}
      </div>
      <div style="margin-top:14px">
        <div style="font-size:13px;color:#64748b;margin-bottom:6px">阈值调整说明</div>
        ${thresholdNotes}
      </div>
    </div>

    <div class="card">
      <div class="section-title">建议</div>
      <ul class="advice-list">${adviceHtml}</ul>
      <div class="disclaimer">${r.disclaimer}</div>
    </div>

    <div class="chat-section">
      <div class="chat-head">
        <div class="chat-head-left">
          <div class="chat-avatar">💬</div>
          <div>
            <h3>和「心语」聊聊</h3>
            <div class="sub">AI 心理支持助手</div>
          </div>
        </div>
        <span class="chat-status" id="chatStatus">检测中…</span>
      </div>
      <div id="safeBanner"></div>
      <div class="chat-box" id="chatBox"></div>
      <div class="quick-replies" id="quickReplies"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="输入你想说的话..." />
        <button class="btn" id="sendBtn">发送</button>
      </div>
      <div class="chat-warn">AI 回复由大模型生成，仅供参考，不构成诊断或治疗建议。如遇紧急情况请拨打 12356。</div>
    </div>

    <button class="btn secondary" onclick="location.reload()">重新测评</button>
  `;

  // 环形图动画
  requestAnimationFrame(() => {
    setTimeout(() => {
      const ring = document.querySelector(".fg-circle");
      if (ring) ring.style.strokeDashoffset = offset;
    }, 100);
  });

  initChat(r.level);
}

function initChat(screenLevel) {
  const chatBox = document.getElementById("chatBox");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("chatStatus");

  let greeting = "你好，我是心语。刚才的结果我看到了，";
  if (screenLevel.includes("危机")) {
    greeting += "我很担心你。你愿意和我说说现在的感受吗？";
  } else if (screenLevel.includes("重度") || screenLevel.includes("中重度")) {
    greeting += "听起来你最近不太好过。想聊点什么吗？";
  } else if (screenLevel.includes("中度") || screenLevel.includes("轻度")) {
    greeting += "如果你愿意，可以和我聊聊最近的状态。";
  } else {
    greeting += "如果你有什么想说的，我都在这里。";
  }
  appendMessage("assistant", greeting);
  chatHistory.push({ role: "assistant", content: greeting });

  const quick = document.getElementById("quickReplies");
  const presets = ["最近睡不好", "压力有点大", "不太想说话", "想找人聊聊"];
  presets.forEach(text => {
    const btn = document.createElement("button");
    btn.textContent = text;
    btn.addEventListener("click", () => {
      chatInput.value = text;
      sendMessage();
    });
    quick.appendChild(btn);
  });

  fetch(`${API_BASE}/api/health`).then(r => r.json()).then(d => {
    if (d.ai_configured) {
      statusEl.textContent = "● 在线";
      statusEl.className = "chat-status online";
    } else {
      statusEl.textContent = "● 未配置密钥";
      statusEl.className = "chat-status offline";
    }
  }).catch(() => {
    statusEl.textContent = "● 无法连接";
    statusEl.className = "chat-status offline";
  });

  sendBtn.addEventListener("click", sendMessage);
  chatInput.addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
  });

  async function sendMessage() {
    const message = chatInput.value.trim();
    if (!message) return;
    chatInput.value = "";
    sendBtn.disabled = true;

    appendMessage("user", message);
    chatHistory.push({ role: "user", content: message });

    const typingEl = appendTyping();

    try {
      const response = await fetch(`${API_BASE}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chatHistory, screen_level: screenLevel })
      });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let aiContent = "";
      let isBlocked = false;
      let riskLevel = "";
      let firstChunk = true;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split("\n");
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6).trim();
          if (data === "[DONE]") continue;
          try {
            const parsed = JSON.parse(data);
            if (parsed.error) aiContent += `[错误] ${parsed.error}`;
            if (parsed.content) aiContent += parsed.content;
            if (parsed.blocked) { isBlocked = true; riskLevel = parsed.risk_level || ""; }

            if (firstChunk) {
              typingEl.innerHTML = `<div class="msg-avatar">心</div><div class="bubble"></div>`;
              firstChunk = false;
            }
            typingEl.querySelector(".bubble").textContent = aiContent;
            chatBox.scrollTop = chatBox.scrollHeight;
          } catch (e) {}
        }
      }

      const bubble = typingEl.querySelector(".bubble");
      if (isBlocked) {
        bubble.classList.add(riskLevel === "p0" ? "crisis" : "safe");
        showSafeBanner(riskLevel);
      }
      chatHistory.push({ role: "assistant", content: aiContent });

    } catch (e) {
      typingEl.innerHTML = `<div class="msg-avatar">心</div><div class="bubble crisis">抱歉，连接失败了：${e.message}</div>`;
    } finally {
      sendBtn.disabled = false;
      chatInput.focus();
    }
  }

  function appendMessage(role, content) {
    const box = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    const avatar = role === "assistant" ? "心" : "我";
    msg.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="bubble">${escapeHtml(content)}</div>`;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
    return msg;
  }

  function appendTyping() {
    const box = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = "msg assistant";
    msg.innerHTML = `<div class="msg-avatar">心</div><div class="bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>`;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
    return msg;
  }

  function showSafeBanner(riskLevel) {
    const banner = document.getElementById("safeBanner");
    if (banner.dataset.shown === "1") return;
    banner.dataset.shown = "1";

    const text = riskLevel === "p0"
      ? "AI 安全响应已启动：已暂停常规对话，为你提供紧急支持资源。"
      : riskLevel === "p1"
      ? "AI 安全响应已启动：检测到风险信号，正在引导你获得支持。"
      : "AI 已进入关注模式：如需要，可随时拨打 12356。";

    banner.innerHTML = `<div class="safe-banner"><span class="icon">🛡️</span><span>${text}</span></div>`;

    const quick = document.getElementById("quickReplies");
    quick.innerHTML = "";
    const hotline = document.createElement("button");
    hotline.textContent = "📞 拨打 12356";
    hotline.addEventListener("click", () => { window.location.href = "tel:12356"; });
    quick.appendChild(hotline);

    const contact = document.createElement("button");
    contact.textContent = "我想联系信任的人";
    contact.addEventListener("click", () => {
      document.getElementById("chatInput").value = "我想联系一个信任的人，你能陪我一起想想吗？";
      document.getElementById("chatInput").focus();
    });
    quick.appendChild(contact);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
</script>
